[package]
name = "assetctl"
version = "0.1.0"
edition = "2024"
description = "Local-first inventory CLI for explicitly authorized assets"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2.1"
inquire = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
